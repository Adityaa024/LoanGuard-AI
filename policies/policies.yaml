version: 1
domain: loan-data-validation
locale: en-US
timezone: UTC

# ---- Agents ----
agents:
  system-uploader: { tier: system, scopeLimit: 0 }
defaultScopeLimit: 0

# ---- Rules ----
rules:
  negative_balance:
    id: POL-BAL-001
    appliesTo: [ingest_loan_record, update_loan_record]
    appealable: true
    description: >
      Principal balance cannot be negative. If negative, it is escalated as a Critical exception.
    onViolation: escalate

  invalid_interest_rate:
    id: POL-RATE-001
    appliesTo: [ingest_loan_record, update_loan_record]
    appealable: true
    description: >
      Interest rate cannot be negative (Critical error). 
      Interest rate > 25% is flagged as High severity warning.
    onViolation: escalate

  missing_borrower:
    id: POL-BOR-001
    appliesTo: [ingest_loan_record, update_loan_record]
    appealable: true
    description: >
      Borrower name cannot be empty.
    onViolation: escalate

  invalid_dates:
    id: POL-DATE-001
    appliesTo: [ingest_loan_record, update_loan_record]
    appealable: true
    description: >
      Maturity date must be after origination date.
    onViolation: escalate

  invalid_state:
    id: POL-STATE-001
    appliesTo: [ingest_loan_record, update_loan_record]
    appealable: true
    description: >
      Property state must be exactly 2 uppercase characters.
    onViolation: escalate

  duplicate_loan:
    id: POL-DUP-001
    appliesTo: [ingest_loan_record]
    appealable: false
    description: >
      Duplicate Loan IDs are strictly forbidden (DENY). The entire record ingestion fails.
    onViolation: deny

  balance_exceeds_principal:
    id: POL-BALCAP-001
    appliesTo: [ingest_loan_record, update_loan_record]
    appealable: true
    description: Current balance should not exceed original principal.
    onViolation: escalate

  payment_status_mismatch:
    id: POL-PAYST-001
    appliesTo: [ingest_loan_record, update_loan_record]
    appealable: true
    description: If payment status is current, days past due must be 0.
    onViolation: escalate

  closed_loan_balance:
    id: POL-CLOSED-001
    appliesTo: [ingest_loan_record, update_loan_record]
    appealable: true
    description: Closed loans should not have a positive balance.
    onViolation: escalate

  missing_document_status:
    id: POL-DOC-001
    appliesTo: [ingest_loan_record, update_loan_record]
    appealable: true
    description: Required document status is missing.
    onViolation: escalate

  stale_record:
    id: POL-STALE-001
    appliesTo: [ingest_loan_record, update_loan_record]
    appealable: true
    description: Record is older than 90 days.
    onViolation: escalate

  duplicate_borrower_combo:
    id: POL-BORCMB-001
    appliesTo: [ingest_loan_record]
    appealable: true
    description: Suspicious duplicate borrower with same loan amount and origination date.
    onViolation: escalate

  cross_source_conflict:
    id: POL-CONFLICT-001
    appliesTo: [ingest_loan_record, update_loan_record]
    appealable: true
    description: Conflicting values between originator baseline tape and secondary servicer update.
    onViolation: escalate

