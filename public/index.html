<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE HIVE — governance layer for agent swarms</title>
  <style>
    :root { --bg:#0b0e14; --amber:#f6b73c; --comb:#15202b; --txt:#e8edf2; --muted:#7f8b99; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: radial-gradient(1200px 800px at 70% -10%, #15202b 0%, var(--bg) 60%); color:var(--txt);
           min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .wrap { text-align:center; padding:48px; max-width:720px; }
    .hex { font-size:64px; filter: drop-shadow(0 0 24px rgba(246,183,60,.5)); }
    h1 { font-size:40px; letter-spacing:.06em; margin:.2em 0 0; }
    .tag { color:var(--muted); font-size:16px; margin-top:8px; line-height:1.5; }
    .pill { display:inline-flex; gap:8px; align-items:center; margin-top:28px; padding:10px 18px;
            border:1px solid #243140; border-radius:999px; background:rgba(21,32,43,.6); font-size:14px; }
    .dot { width:10px; height:10px; border-radius:50%; background:#3a4654; }
    .dot.ok { background:#36d399; box-shadow:0 0 10px #36d399; }
    .meta { margin-top:14px; color:var(--muted); font-size:13px; font-family: ui-monospace, monospace; }
    code { color:var(--amber); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hex">⬡</div>
    <h1>THE HIVE</h1>
    <div class="tag">A live governance layer for swarms of autonomous AI agents.<br/>
      The Warden authorizes, denies, or escalates every action against written policy.</div>
    <div class="pill"><span class="dot" id="dot"></span><span id="status">checking service…</span></div>
    <div class="meta" id="meta"></div>
  </div>
  <script>
    fetch('/health').then(r => r.json()).then(h => {
      document.getElementById('dot').classList.add('ok');
      document.getElementById('status').textContent = 'service up — ' + (h.seeded ? 'seeded' : 'not seeded');
      document.getElementById('meta').innerHTML =
        'loans: <code>' + (h.loanCount||0) + '</code> &nbsp; tasks: <code>' + (h.taskCount||0) + '</code> &nbsp; ' + h.time;
    }).catch(() => {
      document.getElementById('status').textContent = 'service unreachable';
    });
  </script>
</body>
</html>
